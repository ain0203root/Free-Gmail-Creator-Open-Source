name: Static Repository Review

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-review:
    name: Inspect files without building or executing the app
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Inspect project structure and source text
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import xml.etree.ElementTree as ET

          root = Path(".").resolve()
          report = [
              "# Static repository review",
              "",
              "> Static inspection only: the application, project build, and repository DLL files are not executed.",
              "",
          ]

          files = sorted(
              p for p in root.rglob("*")
              if p.is_file() and ".git" not in p.parts and ".github" not in p.parts
          )
          report += ["## File inventory", "", "| Path | Size (bytes) | SHA-256 (binary/executable files) |", "|---|---:|---|"]
          binary_exts = {".dll", ".exe", ".bin", ".sys", ".msi"}
          for path in files:
              rel = path.relative_to(root).as_posix()
              size = path.stat().st_size
              digest = hashlib.sha256(path.read_bytes()).hexdigest() if path.suffix.lower() in binary_exts else "—"
              report.append(f"| `{rel}` | {size} | {digest} |")
          report.append("")

          report += ["## Solution and dependency-path checks", ""]
          sln_files = list(root.rglob("*.sln"))
          if not sln_files:
              report.append("- WARNING: no .sln file found.")
          for sln in sln_files:
              content = sln.read_text(encoding="utf-8-sig", errors="replace")
              project_refs = []
              for line in content.splitlines():
                  if line.startswith("Project(") and ".csproj" in line.lower():
                      project_refs += [part for part in line.split('"') if part.lower().endswith(".csproj")]
              report.append(f"- Solution: `{sln.relative_to(root).as_posix()}`")
              for ref in project_refs:
                  target = (sln.parent / Path(ref.replace(chr(92), "/"))).resolve()
                  exists = target.is_file()
                  status = "OK" if exists else "MISSING"
                  report.append(f"  - [{status}] project reference `{ref}`")
          csprojs = list(root.rglob("*.csproj"))
          for csproj in csprojs:
              report.append(f"- Project: `{csproj.relative_to(root).as_posix()}`")
              try:
                  tree = ET.parse(csproj)
                  for node in tree.iter():
                      if node.tag.split("}")[-1] == "HintPath" and node.text:
                          hint = node.text.strip()
                          target = (csproj.parent / Path(hint.replace(chr(92), "/"))).resolve()
                          if not target.is_file():
                              report.append(f"  - [MISSING IN CHECKOUT] HintPath `{hint}`")
              except ET.ParseError as exc:
                  report.append(f"  - [ERROR] Could not parse project XML: {exc}")
          if not sln_files and not csprojs:
              report.append("- WARNING: no Visual Studio solution or project file found.")
          report.append("")

          report += [
              "## Heuristic source indicators",
              "",
              "Matches below are review leads, not proof of malicious behavior. DLL internals are not decompiled or executed.",
              "",
          ]
          indicators = {
              "process execution": ["process.start", "processstartinfo", "createprocess", "cmd.exe", "powershell"],
              "network APIs or sockets": ["httpclient", "webclient", "tcpclient", "socket", "webrequest", "fetch(", "xmlhttprequest", "https://", "http://"],
              "browser storage/cookies": ["getallcookie", "getcookie", "setcookie", "localstorage", "userdatadir", "cookie"],
              "credentials or phone-verification fields": ["password", "phonekey", "recoveryemail", "authorization", "apikey", "token"],
              "native interop": ["dllimport", "libraryimport", "marshal."],
          }
          scanned_exts = {".cs", ".xml", ".config", ".csproj", ".md", ".json", ".yml", ".yaml", ".ps1", ".bat", ".cmd"}
          matches = 0
          for path in files:
              if path.suffix.lower() not in scanned_exts:
                  continue
              data = path.read_text(encoding="utf-8-sig", errors="replace")
              for line_no, line in enumerate(data.splitlines(), 1):
                  lowered = line.lower()
                  for label, tokens in indicators.items():
                      if any(token in lowered for token in tokens):
                          report.append(f"- `{path.relative_to(root).as_posix()}:{line_no}` — {label}")
                          matches += 1
                          break
          if matches == 0:
              report.append("- No matches for the listed heuristic indicators.")
          report += [
              "",
              f"Total source-line matches: {matches}",
              "",
              "## Important limitations",
              "",
              "- This is not a malware verdict and does not prove that the application is safe.",
              "- Static text scans cannot determine the complete behavior of precompiled DLLs.",
              "- No EXE, installer, release, or executable build artifact is created by this workflow.",
              "- Inspect the report and source manually before running any downloaded program.",
              "",
          ]
          report_text = chr(10).join(report)
          Path("static-review.md").write_text(report_text, encoding="utf-8")
          print(report_text)
          PY

      - name: Upload the text report
        uses: actions/upload-artifact@v4
        with:
          name: static-repository-review
          path: static-review.md
          if-no-files-found: error
          retention-days: 14
